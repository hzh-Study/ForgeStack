[mcp_servers.web_mysql]
type = "stdio"
command = "npx"
args = ["-y", "mysql-mcp-server"]
startup_timeout_sec = 120

[mcp_servers.web_mysql.env]
MYSQL_HOST = "127.0.0.1"
MYSQL_PORT = "3306"
MYSQL_USER = "root"
MYSQL_PASSWORD = "123456"
MYSQL_DATABASE = "forgestack"

[mcp_servers.web_mysql.tools.describe_table]
approval_mode = "approve"

[mcp_servers.web_mysql.tools.execute_query]
approval_mode = "approve"
