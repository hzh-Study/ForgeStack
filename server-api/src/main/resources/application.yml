spring:
  application:
    name: web-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:base}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-request-size: ${FILE_MAX_REQUEST_SIZE:20MB}
      max-file-size: ${FILE_MAX_SIZE:10MB}

server:
  port: ${SERVER_PORT:7245}

app:
  name: 字母哥脚手架
  version: 0.0.1
  file:
    upload-dir: external-resources
    access-prefix: /files
    max-size: ${FILE_MAX_SIZE_BYTES:10485760}
    allowed-extensions: ${FILE_ALLOWED_EXTENSIONS:jpg,jpeg,png,gif,webp,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,rar,txt}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    # 优先读取 JWT_SECRET 环境变量；未配置时自动生成并保存到该文件，仓库中不保存固定密钥
    secret-file: ${JWT_SECRET_FILE:}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:7200}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: true
  is-share: false
  is-read-body: false
  is-read-cookie: false
  is-read-header: true

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.web.module.*.entity
  global-config:
    db-config:
      table-prefix:
      update-strategy: ignored
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
