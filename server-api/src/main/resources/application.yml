  version: 0.0.1
  file:
    upload-dir: external-resources
    access-prefix: /files

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  jwt-secret-key: gdwsigb25387562178hwegrfuqwbrqwuvrwuqy
  timeout: 6048000
